# Self-updating content pipeline.
#
# Runs the updater in the cloud on a schedule, commits the fresh JSON, and the
# push triggers the Pages deploy — the site refreshes itself with no computer on.
#
# Secrets (repo Settings → Secrets and variables → Actions), all optional —
# missing ones skip gracefully:
#   ANTHROPIC_API_KEY                       events/news/restaurants sections
#   REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET  Power Rankings reddit mentions
#   GOOGLE_PLACES_API_KEY                   review velocity + restaurant photos

name: Update content

on:
  schedule:
    # Single weekly cron. Daily news moved to the desktop scheduled tasks
    # (no ANTHROPIC_API_KEY secret — the user opted out of metered billing),
    # so a daily cloud run had nothing left to do and only created chances
    # to mis-fire (it un-published a ranking on 2026-07-06).
    - cron: "0 11 * * 1"    # Mondays 6:00 AM CDT — rankings + full refresh
  workflow_dispatch:
    inputs:
      target:
        description: "Section to update (news, events, restaurants, rankings, all)"
        default: "all"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute data-driven Power Rankings + restaurant photos (Mondays only)
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        # Rankings are a weekly product. Running the scorer daily consumes the
        # review-count deltas one day at a time, which both starves the weekly
        # signal and lets a single busy day publish a statistically thin
        # ranking (this happened on 2026-07-03).
        run: |
          # The only cron is Monday 11:00 UTC, so any scheduled run is the
          # weekly run. The day check guards against a stale run being
          # re-run on a later day, which would consume review deltas
          # mid-week and re-anchor the baselines.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            node scripts/compute-buzz.mjs
            node scripts/compute-football.mjs   # offline Elo replay; no-op until season games exist
          else
            echo "Not the weekly rankings run — skipping (weekly cadence)."
          fi

      - name: Check for API key
        id: keycheck
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret set — skipping content update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.keycheck.outputs.enabled == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Determine target
        if: steps.keycheck.outputs.enabled == 'true'
        id: target
        run: |
          # Only one cron remains (Mondays), so every scheduled run is "all".
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Update content
        if: steps.keycheck.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-content.mjs ${{ steps.target.outputs.target }}

      - name: Commit and push changes
        run: |
          git config user.name "the-956-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/ + both photo dirs: compute-buzz downloads photos into
          # assets/photos/ (site) and social/photos/ (carousels); committing
          # only data/ would strand the JSON pointing at files that were
          # thrown away with the runner.
          git add data/ assets/photos/ social/photos/
          git diff --cached --quiet && echo "No content changes." && exit 0
          git commit -m "Auto-update content ($(date -u +%Y-%m-%d))"
          git push
