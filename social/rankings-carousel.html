<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,50&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fdf8ee; --paper-2: #f7efdd; --ink: #22301f; --ink-soft: #5a6653;
    --sunset: #e4582b; --sunset-deep: #c2431c; --citrus: #f0a832;
    --palm: #2e6e4e; --palm-deep: #1d4a33; --card: #fffdf7; --line: #e4d9c2;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); }
  .slide {
    width: 1080px; height: 1350px;
    background: var(--paper);
    background-image: radial-gradient(ellipse 1400px 700px at 50% -150px, #fdeed3 0%, var(--paper) 62%);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .slide + .slide { margin-top: 40px; }
  .band { background: var(--palm-deep); color: #f2ecd9; font-weight: 700; font-size: 26px; letter-spacing: 0.04em; padding: 22px 56px; display: flex; justify-content: space-between; }
  .pad { padding: 56px 64px; flex: 1; display: flex; flex-direction: column; }
  .sun { position: absolute; top: -220px; left: 50%; transform: translateX(-50%); width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(240,168,50,0.30) 0%, rgba(240,168,50,0) 68%); }

  /* cover */
  .cover-mast { text-align: center; margin-top: 40px; }
  .cover-mast .overline { font-size: 24px; font-weight: 700; letter-spacing: 0.18em; color: var(--sunset); text-transform: uppercase; }
  .cover-mast h1 { font-family: var(--serif); font-weight: 800; font-size: 100px; line-height: 1; letter-spacing: -0.02em; color: var(--ink); margin-top: 18px; }
  .cover-mast h1 em { color: var(--sunset); font-style: italic; }
  .crown-big { text-align: center; font-size: 150px; margin-top: 44px; }
  .cover-hook { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 66px; color: var(--ink); margin-top: 40px; padding: 0 30px; line-height: 1.15; }
  .cover-hook em { color: var(--sunset); font-style: italic; }
  .cover-sub { text-align: center; font-size: 32px; color: var(--ink-soft); margin-top: 30px; padding: 0 60px; line-height: 1.45; }
  .cover-footer { margin-top: auto; text-align: center; padding-bottom: 20px; font-size: 26px; font-weight: 700; color: var(--palm-deep); }

  /* spot slide */
  .sp-photo { position: relative; width: 100%; height: 660px; flex-shrink: 0; overflow: hidden; background: var(--paper-2); }
  .sp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sp-photo-tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(29,74,51,0.15) 0%, rgba(29,74,51,0.05) 45%, var(--paper) 100%); }
  .medal { position: absolute; top: 36px; left: 40px; width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 900; font-size: 84px; background: var(--card); border: 6px solid var(--citrus); color: var(--citrus); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .medal.gold { border-color: var(--sunset); color: var(--sunset); }
  .crown-tag { position: absolute; top: -46px; left: 50%; transform: translateX(-50%); font-size: 44px; }
  .pad.sp-pad { padding-top: 40px; }
  .sp-name { font-family: var(--serif); font-weight: 700; font-size: 58px; line-height: 1.08; color: var(--ink); }
  .sp-city { font-size: 26px; font-weight: 700; color: var(--palm); margin-top: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sp-known { font-family: var(--serif); font-size: 36px; line-height: 1.38; color: var(--ink); margin-top: 32px; }
  .badge-row { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 14px; }
  .pill { font-size: 23px; font-weight: 800; letter-spacing: 0.04em; padding: 12px 26px; border-radius: 999px; background: #eaf3ec; color: var(--palm-deep); border: 2px solid #cde3d4; }
  .pill.hot { background: #fdeeda; color: #a4610d; border-color: #f3d9ad; }
  .sp-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 26px; border-top: 3px double var(--line); }
  .sp-footer .brand { font-family: var(--serif); font-weight: 800; font-size: 34px; color: var(--ink); }
  .sp-footer .brand em { color: var(--sunset); font-style: italic; }
  .sp-footer .swipe { font-size: 24px; font-weight: 700; color: var(--ink-soft); }

  /* radar */
  .radar-title { font-family: var(--serif); font-weight: 700; font-size: 58px; color: var(--ink); margin-top: 20px; }
  .radar-sub { font-size: 30px; color: var(--ink-soft); margin-top: 20px; line-height: 1.4; }
  .radar-list { margin-top: 50px; display: flex; flex-direction: column; gap: 34px; }
  .radar-item { display: flex; align-items: center; gap: 26px; }
  .radar-item .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--citrus); flex-shrink: 0; }
  .radar-item .name { font-family: var(--serif); font-weight: 700; font-size: 38px; color: var(--ink); }
  .radar-item .desc { font-size: 26px; color: var(--ink-soft); margin-top: 4px; }

  /* CTA */
  .cta-icon { text-align: center; font-size: 130px; margin-top: 70px; }
  .cta-title { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 66px; color: var(--ink); margin-top: 30px; padding: 0 40px; line-height: 1.2; }
  .cta-title em { color: var(--sunset); font-style: italic; }
  .cta-body { text-align: center; font-size: 32px; color: var(--ink-soft); margin-top: 32px; padding: 0 60px; line-height: 1.5; }
  .cta-prompt { margin: 56px 60px 0; background: var(--palm-deep); color: #f2ecd9; border-radius: 20px; padding: 42px 44px; font-family: var(--serif); font-style: italic; font-size: 34px; text-align: center; line-height: 1.4; }
</style>
</head>
<body>
<script>
// Data-driven: always reads the live data/top-eats.json, so this carousel
// can never show a different ranking than the website.
(async () => {
  const top = await fetch("../data/top-eats.json", { cache: "no-store" }).then(r => r.json());
  const spots = top.spots;

  const cover = document.createElement("div");
  cover.className = "slide";
  cover.id = "slide-0";
  cover.innerHTML = `
    <div class="sun"></div>
    <div class="pad">
      <div class="cover-mast">
        <div class="overline">The 956 Power Rankings</div>
        <h1>This Week's <em>Top 5</em></h1>
      </div>
      <div class="crown-big">👑</div>
      <div class="cover-hook">The RGV spots<br><em>everyone's</em> talking about</div>
      <div class="cover-sub">${top.disclaimer}</div>
      <div class="cover-footer">Swipe for the lineup · the956.com</div>
    </div>
  `;
  document.body.appendChild(cover);

  spots.forEach((s, i) => {
    const slide = document.createElement("div");
    slide.className = "slide";
    slide.id = "slide-" + (i + 1);
    const photoTag = s.photo
      ? `<img src="photos/${s.photo}" alt="${s.name}" onerror="this.remove()">`
      : "";
    const pills = [];
    if ((s.badges || []).includes("new_entry")) pills.push(`<span class="pill hot">New Entry</span>`);
    if ((s.badges || []).includes("biggest_mover")) pills.push(`<span class="pill hot">Biggest Mover</span>`);
    if (s.rank === 1 && s.streak_weeks > 1) pills.push(`<span class="pill">🔥 ${s.streak_weeks} weeks at #1</span>`);
    if (s.review_delta) pills.push(`<span class="pill">+${s.review_delta} review${s.review_delta === 1 ? "" : "s"} this week</span>`);
    slide.innerHTML = `
      <div class="band"><span>POWER RANKINGS</span><span>#${s.rank} OF ${spots.length}</span></div>
      <div class="sp-photo">
        ${photoTag}
        <div class="sp-photo-tint"></div>
        <div class="medal${s.rank === 1 ? " gold" : ""}">
          ${s.rank === 1 ? '<div class="crown-tag">👑</div>' : ""}
          ${s.rank}
        </div>
      </div>
      <div class="pad sp-pad">
        <div class="sp-name">${s.name}</div>
        <div class="sp-city">📍 ${s.city}</div>
        <div class="sp-known">${s.known_for}</div>
        ${pills.length ? `<div class="badge-row">${pills.join("")}</div>` : ""}
        <div class="sp-footer">
          <div class="brand">The <em>956</em></div>
          <div class="swipe">swipe →</div>
        </div>
      </div>
    `;
    document.body.appendChild(slide);
  });

  if ((top.bubble || []).length) {
    const radar = document.createElement("div");
    radar.className = "slide";
    radar.id = "slide-" + (spots.length + 1);
    radar.innerHTML = `
      <div class="band"><span>ON THE RADAR</span><span>WATCHING</span></div>
      <div class="pad">
        <div class="radar-title">Knocking on the door</div>
        <div class="radar-sub">Just outside this week's Top ${spots.length} — could break in next week.</div>
        <div class="radar-list">
          ${top.bubble.map(b => `<div class="radar-item"><div class="dot"></div><div><div class="name">${b.name}</div><div class="desc">📍 ${b.city}</div></div></div>`).join("")}
        </div>
      </div>
    `;
    document.body.appendChild(radar);
  }

  const cta = document.createElement("div");
  cta.className = "slide";
  cta.id = "slide-" + (spots.length + 2);
  cta.innerHTML = `
    <div class="pad">
      <div class="cta-icon">📊</div>
      <div class="cta-title">Rankings refresh<br><em>every Monday</em></div>
      <div class="cta-body">Tracked by real Google review velocity, adjusted for size and how new a spot is. No opinions — just counts.</div>
      <div class="cta-prompt">Who do YOU think should be #1?<br>Tell us below 👇</div>
    </div>
  `;
  document.body.appendChild(cta);

  const only = new URLSearchParams(location.search).get("slide");
  if (only !== null) {
    document.querySelectorAll(".slide").forEach((s) => {
      s.style.display = s.id === "slide-" + only ? "flex" : "none";
      s.style.margin = "0";
    });
  }
})();
</script>
</body>
</html>
