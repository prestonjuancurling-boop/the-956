<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,50&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #f4ede0; --ink-soft: #cbb98a; --sunset: #e4582b; --citrus: #f0a832;
    --dark: #0c0a08; --dark-2: #17130f; --line: rgba(244,237,224,0.16);
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); }
  .slide { width: 1080px; height: 1350px; background: var(--dark); position: relative; overflow: hidden; }
  .slide + .slide { margin-top: 40px; }

  .bg-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.92); }
  .scrim-top { position: absolute; top: 0; left: 0; right: 0; height: 420px; background: linear-gradient(180deg, rgba(0,0,0,0.78) 0%, transparent 100%); }
  .scrim-bot { position: absolute; bottom: 0; left: 0; right: 0; height: 680px; background: linear-gradient(0deg, rgba(0,0,0,0.94) 22%, rgba(0,0,0,0.55) 60%, transparent 100%); }
  .glow-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 900px 700px at 50% -100px, rgba(228,88,43,0.20) 0%, transparent 60%), var(--dark); }

  .top-row { position: absolute; top: 46px; left: 52px; right: 52px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  .top-row .brand { font-family: var(--serif); font-weight: 800; font-size: 32px; color: #fff; }
  .top-row .brand em { color: var(--citrus); font-style: italic; }
  .top-row .rankpill { background: var(--sunset); color: #fff; font-weight: 800; font-size: 24px; padding: 12px 24px; border-radius: 999px; letter-spacing: 0.02em; }

  .content { position: absolute; bottom: 56px; left: 56px; right: 56px; z-index: 2; }
  .content .overline { font-size: 25px; font-weight: 800; letter-spacing: 0.16em; color: var(--citrus); text-transform: uppercase; }
  .content h1 { font-family: var(--serif); font-weight: 800; font-size: 84px; line-height: 0.98; color: #fff; margin-top: 14px; }
  .content h1 em { color: var(--citrus); font-style: italic; }
  .content .sub { font-size: 29px; color: #e9e2cf; margin-top: 20px; line-height: 1.4; }
  .content .foot { margin-top: 30px; font-size: 23px; font-weight: 700; color: var(--ink-soft); }

  .badge-row { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
  .pill { font-size: 21px; font-weight: 800; letter-spacing: 0.02em; padding: 10px 22px; border-radius: 999px; background: rgba(244,237,224,0.12); color: #fff; border: 1.5px solid rgba(244,237,224,0.25); backdrop-filter: blur(4px); }
  .pill.hot { background: rgba(228,88,43,0.85); border-color: rgba(228,88,43,0.85); }
  .pill.down { background: rgba(244,237,224,0.08); }

  /* no-photo slides (cover teaser / cta) */
  .flat { display: flex; flex-direction: column; padding: 70px 60px; }
  .flat .band { display: flex; justify-content: space-between; align-items: center; }
  .flat .band .brand { font-family: var(--serif); font-weight: 800; font-size: 30px; color: #fff; }
  .flat .band .brand em { color: var(--citrus); font-style: italic; }
  .flat .band .tag { font-size: 23px; font-weight: 800; letter-spacing: 0.1em; color: var(--citrus); text-transform: uppercase; }

  .cover-emoji { text-align: center; font-size: 130px; margin-top: 90px; }
  .cover-hook { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 62px; color: #fff; margin-top: 30px; padding: 0 20px; line-height: 1.2; }
  .cover-hook em { color: var(--citrus); font-style: italic; }
  .cover-body { text-align: center; font-size: 30px; color: var(--ink-soft); margin-top: 30px; padding: 0 40px; line-height: 1.5; }
  .cover-footer { margin-top: auto; text-align: center; font-size: 23px; font-weight: 700; color: var(--ink-soft); }

  .cta-icon { text-align: center; font-size: 130px; margin-top: 90px; }
  .cta-title { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 66px; color: #fff; margin-top: 30px; padding: 0 20px; line-height: 1.2; }
  .cta-title em { color: var(--citrus); font-style: italic; }
  .cta-body { text-align: center; font-size: 30px; color: var(--ink-soft); margin-top: 30px; padding: 0 40px; line-height: 1.5; }
  .cta-prompt { margin: 54px 10px 0; background: var(--sunset); color: #fff; border-radius: 20px; padding: 42px 44px; font-family: var(--serif); font-style: italic; font-size: 34px; text-align: center; line-height: 1.4; }
  .cta-footer { margin-top: auto; text-align: center; font-size: 23px; font-weight: 700; color: var(--ink-soft); }
</style>
</head>
<body>
<script>
// Data-driven: reads the live data/category.json. Renders in "teaser" mode
// (status: measuring — ? medals, no ranks shown) or "reveal" mode (status:
// ranked — real order + medals) automatically, so the same file serves both
// the monthly kickoff post and the weekly result post with zero editing.
(async () => {
  const cat = await fetch("../data/category.json", { cache: "no-store" }).then(r => r.json());
  const revealed = cat.status === "ranked";
  const spots = revealed ? [...cat.spots].sort((a, b) => a.rank - b.rank) : cat.spots;
  const total = spots.length;

  const cover = document.createElement("div");
  cover.className = "slide";
  cover.id = "slide-0";
  if (revealed && spots[0] && spots[0].photo) {
    cover.innerHTML = `
      <img class="bg-photo" src="photos/${spots[0].photo}" onerror="this.remove()">
      <div class="scrim-top"></div>
      <div class="scrim-bot"></div>
      <div class="top-row">
        <div class="brand">The <em>956</em></div>
        <div class="rankpill">RESULTS</div>
      </div>
      <div class="content">
        <div class="overline">${cat.title}</div>
        <h1>${spots[0].name} takes<br>the <em>crown</em></h1>
        <div class="sub">${cat.note}</div>
        <div class="foot">Swipe for the full order · the956.com</div>
      </div>
    `;
  } else {
    cover.className = "slide flat";
    cover.innerHTML = `
      <div class="glow-bg" style="position:absolute;"></div>
      <div style="position:relative;z-index:2;display:flex;flex-direction:column;height:100%;">
        <div class="band"><div class="brand">The <em>956</em></div><div class="tag">Micro-Rankings</div></div>
        <div class="cover-emoji">${revealed ? "👑" : "❓"}</div>
        <div class="cover-hook">${revealed ? "The results are in.<br><em>Meet the winner.</em>" : `${cat.title}<br>${total} contenders. 1 crown.<br><em>Ranking soon.</em>`}</div>
        <div class="cover-body">${revealed ? cat.note : (cat.measuring_note || cat.note)}</div>
        <div class="cover-footer">${revealed ? "See the full order" : "Meet the contenders"} · the956.com</div>
      </div>
    `;
  }
  document.body.appendChild(cover);

  spots.forEach((s, i) => {
    const slide = document.createElement("div");
    slide.className = "slide";
    slide.id = "slide-" + (i + 1);
    const rankLabel = revealed ? `#${s.rank} OF ${total}` : `CONTENDER ${i + 1} OF ${total}`;
    const pills = [];
    if (revealed && s.moved > 0) pills.push(`<span class="pill hot">▲ up ${s.moved} spot${s.moved === 1 ? "" : "s"}</span>`);
    if (revealed && s.moved < 0) pills.push(`<span class="pill down">▼ down ${-s.moved}</span>`);
    if (revealed && s.rank === 1 && s.streak_weeks > 1) pills.push(`<span class="pill">🔥 ${s.streak_weeks} weeks at #1</span>`);
    slide.innerHTML = `
      ${s.photo ? `<img class="bg-photo" src="photos/${s.photo}" onerror="this.remove()">` : `<div class="glow-bg"></div>`}
      <div class="scrim-top"></div>
      <div class="scrim-bot"></div>
      <div class="top-row">
        <div class="brand">The <em>956</em></div>
        <div class="rankpill">${rankLabel}</div>
      </div>
      <div class="content">
        <div class="overline">📍 ${s.display_city || s.city}</div>
        <h1>${s.name}</h1>
        <div class="sub">${s.known_for}</div>
        ${pills.length ? `<div class="badge-row">${pills.join("")}</div>` : ""}
        <div class="foot">swipe →</div>
      </div>
    `;
    document.body.appendChild(slide);
  });

  const cta = document.createElement("div");
  cta.className = "slide flat";
  cta.id = "slide-" + (total + 1);
  cta.innerHTML = revealed ? `
    <div class="glow-bg" style="position:absolute;"></div>
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;height:100%;justify-content:center;">
      <div class="cta-icon" style="margin-top:0;">🔄</div>
      <div class="cta-title">New theme,<br><em>every month</em></div>
      <div class="cta-body">${cat.title} was this month's micro-ranking, tracked with the same real-data engine as the Power Rankings. A new food category kicks off next month.</div>
      <div class="cta-prompt">Tell us who should be in next month's lineup 👇</div>
      <div class="cta-footer" style="margin-top:60px;">the956.com</div>
    </div>
  ` : `
    <div class="glow-bg" style="position:absolute;"></div>
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;height:100%;justify-content:center;">
      <div class="cta-icon" style="margin-top:0;">👑</div>
      <div class="cta-title">Who takes<br>the crown?</div>
      <div class="cta-body">The ranking is computed from real buzz data — Google review velocity and local chatter. No opinions, no favorites.</div>
      <div class="cta-prompt">Call your winner in the comments 👇</div>
      <div class="cta-footer" style="margin-top:60px;">the956.com</div>
    </div>
  `;
  document.body.appendChild(cta);

  const only = new URLSearchParams(location.search).get("slide");
  if (only !== null) {
    document.querySelectorAll(".slide").forEach((s) => {
      s.style.display = s.id === "slide-" + only ? "block" : "none";
      s.style.margin = "0";
    });
  }
})();
</script>
</body>
</html>
