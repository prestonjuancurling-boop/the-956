<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,50&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fdf8ee; --paper-2: #f7efdd; --ink: #22301f; --ink-soft: #5a6653;
    --sunset: #e4582b; --sunset-deep: #c2431c; --citrus: #f0a832;
    --palm: #2e6e4e; --palm-deep: #1d4a33; --card: #fffdf7; --line: #e4d9c2;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); }
  .slide {
    width: 1080px; height: 1350px;
    background: var(--paper);
    background-image: radial-gradient(ellipse 1400px 700px at 50% -150px, #fdeed3 0%, var(--paper) 62%);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .slide + .slide { margin-top: 40px; }
  .band {
    background: var(--palm-deep); color: #f2ecd9;
    font-weight: 700; font-size: 26px;
    letter-spacing: 0.04em; padding: 22px 56px;
    display: flex; justify-content: space-between;
  }
  .pad { padding: 56px 64px; flex: 1; display: flex; flex-direction: column; }
  .sun {
    position: absolute; top: -220px; left: 50%; transform: translateX(-50%);
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(240,168,50,0.30) 0%, rgba(240,168,50,0) 68%);
  }

  /* cover */
  .cover-mast { text-align: center; margin-top: 40px; }
  .cover-mast .overline { font-size: 24px; font-weight: 700; letter-spacing: 0.18em; color: var(--sunset); text-transform: uppercase; }
  .cover-mast h1 { font-family: var(--serif); font-weight: 800; font-size: 118px; line-height: 1; letter-spacing: -0.02em; color: var(--ink); margin-top: 18px; }
  .cover-mast h1 em { color: var(--sunset); font-style: italic; }
  .cover-emoji { text-align: center; font-size: 150px; margin-top: 44px; }
  .cover-hook { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 74px; color: var(--ink); margin-top: 40px; line-height: 1.15; }
  .cover-hook em { color: var(--sunset); font-style: italic; }
  .cover-sub { text-align: center; font-size: 32px; color: var(--ink-soft); margin-top: 30px; padding: 0 60px; line-height: 1.45; }
  .cover-footer { margin-top: auto; text-align: center; padding-bottom: 20px; font-size: 26px; font-weight: 700; color: var(--palm-deep); }

  /* contender slide */
  .c-photo { position: relative; width: 100%; height: 660px; flex-shrink: 0; overflow: hidden; background: var(--paper-2); }
  .c-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .c-tint {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(29,74,51,0.15) 0%, rgba(29,74,51,0.05) 45%, var(--paper) 100%);
  }
  .q-medal {
    position: absolute; top: 36px; left: 40px;
    width: 150px; height: 150px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 900; font-size: 84px;
    background: var(--card); border: 6px solid var(--citrus); color: var(--citrus);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .c-pad { padding-top: 40px; }
  .c-name { font-family: var(--serif); font-weight: 700; font-size: 58px; line-height: 1.08; color: var(--ink); }
  .c-city { font-size: 26px; font-weight: 700; color: var(--palm); margin-top: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .c-known { font-family: var(--serif); font-size: 38px; line-height: 1.4; color: var(--ink); margin-top: 36px; }
  .c-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 26px; border-top: 3px double var(--line); }
  .c-footer .brand { font-family: var(--serif); font-weight: 800; font-size: 34px; color: var(--ink); }
  .c-footer .brand em { color: var(--sunset); font-style: italic; }
  .c-footer .swipe { font-size: 24px; font-weight: 700; color: var(--ink-soft); }

  /* CTA */
  .cta-emoji { text-align: center; font-size: 130px; margin-top: 70px; }
  .cta-title { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 70px; color: var(--ink); margin-top: 30px; padding: 0 40px; line-height: 1.18; }
  .cta-title em { color: var(--sunset); font-style: italic; }
  .cta-body { text-align: center; font-size: 32px; color: var(--ink-soft); margin-top: 32px; padding: 0 70px; line-height: 1.5; }
  .cta-prompt {
    margin: 56px 60px 0;
    background: var(--palm-deep); color: #f2ecd9; border-radius: 20px; padding: 42px 44px;
    font-family: var(--serif); font-style: italic; font-size: 36px; text-align: center; line-height: 1.4;
  }
</style>
</head>
<body>

  <!-- SLIDE 0: COVER -->
  <div class="slide" id="slide-0">
    <div class="sun"></div>
    <div class="pad">
      <div class="cover-mast">
        <div class="overline">The 956 Micro-Rankings · July</div>
        <h1>The <em>Raspa</em> Rankings</h1>
      </div>
      <div class="cover-emoji">🍧</div>
      <div class="cover-hook">5 contenders.<br>1 crown.<br><em>Monday.</em></div>
      <div class="cover-sub">We're tracking real buzz data on the Valley's most legendary raspa spots. First-ever ranking drops Monday →</div>
      <div class="cover-footer">Meet the contenders · the956.com</div>
    </div>
  </div>

  <div id="contenders"></div>

<script>
const spots = [
  { name: "Young's Sno Wiz", city: "McAllen", photo: "photos/young-s-sno-wiz.jpg",
    known: "The McAllen institution locals swear has the best raspas in the Valley." },
  { name: "Margo's", city: "RGV", photo: "photos/margo-s.jpg",
    known: "60+ combos with homemade syrups — home of the legendary mangonada." },
  { name: "Viva La Raspa", city: "Weslaco", photo: "photos/viva-la-raspa.jpg",
    known: "Mexican-blanket murals and raspas born from watching everyone else's long lines." },
  { name: "Iced Cube", city: "Elsa", photo: "photos/iced-cube.jpg",
    known: "People drive from San Antonio and Corpus for this stand. Worth the trip to Elsa." },
  { name: "Fruti Raspas La Isla", city: "McAllen", photo: "photos/fruti-raspas-la-isla.jpg",
    known: "Fruteria-style raspas piled with fresh fruit, chamoy and everything on it." }
];

const container = document.getElementById("contenders");
spots.forEach((s, i) => {
  const slide = document.createElement("div");
  slide.className = "slide";
  slide.id = "slide-" + (i + 1);
  slide.innerHTML = `
    <div class="band"><span>THE RASPA RANKINGS · CONTENDER</span><span>${i + 1} OF 5</span></div>
    <div class="c-photo">
      <img src="${s.photo}" alt="${s.name}">
      <div class="c-tint"></div>
      <div class="q-medal">?</div>
    </div>
    <div class="pad c-pad">
      <div class="c-name">${s.name}</div>
      <div class="c-city">📍 ${s.city}</div>
      <div class="c-known">${s.known}</div>
      <div class="c-footer">
        <div class="brand">The <em>956</em></div>
        <div class="swipe">swipe →</div>
      </div>
    </div>
  `;
  container.appendChild(slide);
});

// FINAL SLIDE: VOTE CTA
const cta = document.createElement("div");
cta.className = "slide";
cta.id = "slide-6";
cta.innerHTML = `
  <div class="pad">
    <div class="cta-emoji">👑</div>
    <div class="cta-title">Who takes<br>the crown?</div>
    <div class="cta-body">The ranking is computed from real buzz data — Google review velocity and local chatter. No opinions, no favorites. Results Monday at the956.com.</div>
    <div class="cta-prompt">Call your winner in the comments 👇<br>¿Cuál es la mejor raspa del Valle?</div>
  </div>
`;
document.body.insertBefore(cta, document.currentScript);

// ?slide=N isolates a single slide for clean headless-Chrome screenshotting.
const only = new URLSearchParams(location.search).get("slide");
if (only !== null) {
  document.querySelectorAll(".slide").forEach((s) => {
    s.style.display = s.id === "slide-" + only ? "flex" : "none";
    s.style.margin = "0";
  });
}
</script>
</body>
</html>
